# Rsyslog receptor para MikroTik / OLTs
module(load="imudp")
module(load="imtcp")

input(type="imudp" port="5514")
input(type="imtcp" port="5514")

template(name="MikrotikJson" type="list" option.json="on") {
  constant(value="{")
    constant(value="\"timestamp\":\"")     property(name="timereported" dateFormat="rfc3339") constant(value="\",")
    constant(value="\"host\":\"")         property(name="hostname") constant(value="\",")
    constant(value="\"fromip\":\"")       property(name="fromhost-ip") constant(value="\",")
    constant(value="\"facility\":\"")     property(name="syslogfacility-text") constant(value="\",")
    constant(value="\"severity\":\"")     property(name="syslogseverity-text") constant(value="\",")
    constant(value="\"tag\":\"")          property(name="syslogtag") constant(value="\",")
    constant(value="\"program\":\"")      property(name="programname") constant(value="\",")
    constant(value="\"message\":\"")      property(name="msg" format="json") constant(value="\"")
  constant(value="}\n")
}

# Descartar ruido de depuración (paquetes PPPoE/DHCP) antes de escribir a disco.
# Se conserva si la severidad es warning (4) o peor: 0=emerg ... 7=debug.
if ($syslogtag contains ",debug" and $syslogseverity > 4) then stop

*.* action(type="omfile" file="/var/log/mikrotik/all.jsonl" template="MikrotikJson" flushOnTXEnd="on")
