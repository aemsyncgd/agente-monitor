# compose.yml - Agente Monitor
# Fuente única de verdad para la infraestructura de contenedores.
# Los 3 servicios comparten la red "agente-monitor-net", por lo que se
# resuelven entre sí por nombre de servicio/contenedor.

name: agente-monitor

networks:
  agente-monitor-net:
    name: agente-monitor-net
    driver: bridge

services:
  influxdb-ia:
    image: docker.io/library/influxdb:2.7
    container_name: influxdb-ia
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_SETUP=false
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN}
    volumes:
      - ./influxdb/data:/var/lib/influxdb2
      - ./influxdb/config:/etc/influxdb2
    networks:
      - agente-monitor-net
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis-ia:
    image: docker.io/library/redis:7-alpine
    container_name: redis-ia
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - ./redis/data:/data
    networks:
      - agente-monitor-net
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # --- SYSLOG MIKROTIK ---
  mikrotik-syslog:
    image: docker.io/rsyslog/rsyslog:latest
    container_name: mikrotik-syslog
    restart: unless-stopped
    # rsyslog corre como usuario "syslog" (no root): usamos 5514 también
    # dentro del contenedor para no necesitar el puerto privilegiado 514.
    ports:
      - "5514:5514/udp"
      - "5514:5514/tcp"
    volumes:
      - ./mikrotik-syslog/config/rsyslog.conf:/etc/rsyslog.conf:ro
      - ./mikrotik-syslog/logs:/var/log/mikrotik:Z
    networks:
      - agente-monitor-net
