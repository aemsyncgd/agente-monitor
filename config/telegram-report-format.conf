# ============================================================
# config/telegram-report-format.conf
# Formato del reporte diario optimizado para Telegram
# ============================================================

[branding]
timezone = America/Caracas
footer_text = Agente Monitor | Reporte diario

[emojis]
olt_up = 🟢
olt_down = 🔴
olt_warn = 🟡
pon_up = 🟢
pon_down = 🔴
pon_warn = 🟡
pon_orange = 🟠
pon_unknown = ❓
pon_users = 👥
traffic_in = ▼
traffic_out = ▲
mk_up = 🟢
mk_down = 🔴
mk_warn = 🟡
mk_no_iface = △
mk_stale = ◇
sev_0 = ○
sev_1 = ○
sev_2 = ●
sev_3 = ◉
sev_4 = ◎
sev_5 = ●
alert_ack = 
summary_date = ▸
summary_online = ◉
summary_offline = ◌
summary_alerts = ⚠️
section_olt = ▸
section_mk = ▸
section_alerts = ▸
report_icon = ▸
chart_icon = ▸

[colors]
report_ok = 3066993
report_alert = 15158332
olt_color = 3447003
mk_color = 3447003
alert_color = 15158332
chart_color = 5763719

[text]
report_title = ▸ Reporte VidaNet
olt_section_title = OLTs
mk_section_title = MikroTiks / Nodos
alert_section_title = Alertas Recientes
generated_label = Generado
online_label = En linea
offline_label = Fuera de linea
alerts_label = Alertas
unit_text = equipos
no_iface_msg = Sin datos de interfaz
no_snmp_msg = ⚠ Responde a ping, sin datos SNMP
truncated_msg = ...
date_format = %d/%m/%Y %H:%M
stale_label = Sin datos recientes
ago_suffix = hace
ago_min = min

[templates]
summary = {summary_date} <b>{generated_label}:</b> {date}  <i>{timezone}</i>\n{summary_online} <b>{online_label}:</b>  {online_count}/{total}\n{summary_offline} <b>{offline_label}:</b>  {offline_count}\n{offline_hosts}{summary_alerts} <b>{alerts_label}:</b>  {problem_count}

olt_section_header = {section_olt} <b>{olt_section_title}</b>  —  {count} {unit_text}
olt_host = <b>{olt_emoji} {name}</b>  <i>({ip})</i>
pon_line =   <code>{pon}</code>  {pon_emoji}  👥 {online}/{offline}  ▼ {traffic_in_val}  ▲ {traffic_out_val}

mk_section_header = {section_mk} <b>{mk_section_title}</b>  —  {count}
mk_host = <b>{mk_emoji} {name}</b>  <i>({ip})</i>
mk_iface =   <code>{iface}</code>  ▼ {traffic_in_val}  ▲ {traffic_out_val}
mk_iface_stale =   <code>{iface}</code>  {mk_stale}  {stale_label}  ({ago_suffix} {ago_min})
mk_no_iface =   <i>{no_iface_msg}</i>

alert_line = {alert_emoji} <code>{time}</code>  <b>{host_name}</b>\n  {alert_name}
alert_section_header = {section_alerts} <b>{alert_section_title}</b>  —  {count}

incident_line = <code>{time}</code>  <b>{olt}</b>  {pon}  —  {type}  <i>({serial})</i>
incident_section_header = {section_alerts} <b>Incidencias 24h (LOS / DyingGap)</b>  —  ult. {count}

chart_stats = <b>{chart_icon} {host_name}  —  {iface_name}</b>\n🌙 <b>Nocturno (21:00-08:00):</b>  {night_avg} promedio  |  {night_max} pico\n☀ <b>Diurno (08:00-21:00):</b>  {day_avg} promedio  |  {day_max} pico\n<b>Total 24h:</b>  {total_avg} promedio  |  {total_max} max  |  {total_min} min\n{analysis_text}

olt_separator = 
mk_separator = 
alert_separator = 
incident_separator = 

[sections]
show_alerts = yes
show_charts = yes
order = summary,olt,mk,charts,incidents

[limits]
max_desc = 4000
max_problems = 15
max_alert_name = 50
chart_hours = 24
chart_dpi = 130
stale_threshold_sec = 300

[chart_targets]
auto_detect = yes
mikrotik_max_interfaces = 5
