<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 1200 320" width="1200" height="320">
  <title>Agente Monitor — Monitoreo FTTH/GPON con IA</title>
  <defs>
    <linearGradient id="bgLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf2fa"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0284c7"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#d7e1f1" opacity="0.9"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bgLight)"/>
  <rect width="1200" height="320" fill="url(#dots)"/>
  <circle cx="260" cy="150" r="250" fill="url(#glowCyan)"/>
  <circle cx="260" cy="150" r="430" fill="url(#glowPink)"/>

  <path d="M 70 298 L 320 298 L 368 240 L 420 284 L 470 222 L 522 276 L 578 298 L 800 298"
        fill="none" stroke="#2563eb" stroke-width="3" opacity="0.5" stroke-linecap="round" stroke-linejoin="round"/>

  <g stroke="#94a3b8" stroke-width="2" opacity="0.9">
    <line x1="820" y1="215" x2="900" y2="255"/>
    <line x1="820" y1="265" x2="900" y2="255"/>
    <line x1="820" y1="315" x2="900" y2="255"/>
    <line x1="900" y1="255" x2="985" y2="265" stroke="#7c3aed" stroke-width="2.5"/>
  </g>
  <circle cx="820" cy="215" r="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <circle cx="820" cy="265" r="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <circle cx="820" cy="315" r="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <circle cx="900" cy="255" r="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="985" cy="265" r="11" fill="url(#titleGrad)"/>
  <circle cx="985" cy="265" r="23" fill="none" stroke="#db2777" stroke-width="1.5" opacity="0.55"/>

  <text x="74" y="96" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="16" letter-spacing="7" fill="#7c3aed" font-weight="700">NOC · FTTH/GPON · IA</text>
  <text x="70" y="160" font-family="'Inter','Segoe UI',Arial,Helvetica,sans-serif" font-size="64" font-weight="800" fill="url(#titleGrad)" letter-spacing="1">AGENTE MONITOR</text>
  <text x="72" y="208" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="21" fill="#475569">Monitoreo autónomo&nbsp;&nbsp;·&nbsp;&nbsp;SNMP → InfluxDB → ML → LLM → Telegram</text>

  <g font-family="'JetBrains Mono',Consolas,monospace" font-size="15" font-weight="600">
    <rect x="70" y="248" width="126" height="32" rx="16" fill="#ffffff" stroke="#c7d3e8" stroke-width="1.5"/>
    <text x="133" y="269" fill="#0284c7" text-anchor="middle">PyTorch · 2.x</text>
    <rect x="206" y="248" width="140" height="32" rx="16" fill="#ffffff" stroke="#c7d3e8" stroke-width="1.5"/>
    <text x="276" y="269" fill="#15803d" text-anchor="middle">FastAPI · 0.100</text>
    <rect x="356" y="248" width="126" height="32" rx="16" fill="#ffffff" stroke="#c7d3e8" stroke-width="1.5"/>
    <text x="419" y="269" fill="#db2777" text-anchor="middle">InfluxDB · 2.x</text>
    <rect x="492" y="248" width="112" height="32" rx="16" fill="#ffffff" stroke="#c7d3e8" stroke-width="1.5"/>
    <text x="548" y="269" fill="#7c3aed" text-anchor="middle">Ollama</text>
  </g>

  <rect x="0" y="314" width="1200" height="6" fill="url(#barGrad)" opacity="0.9"/>
</svg>